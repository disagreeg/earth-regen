<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth ReGen</title>

<link rel="stylesheet" href="fonts.css?v=1365">

<link rel="stylesheet" href="css/style.css?v=1365">
</head>
<body>

<header id="topbar">
  <div class="cur-block ci">
    <div class="cur-ic"></div>
    <div>
      <div class="cur-label">CLEAN INDEX</div>
      <div class="cur-amount"><span id="ci-value">0</span></div>
    </div>
    <div class="cur-rate" id="ci-rate" title="What your machines produce, as they produce it">0 CI/h</div>
  </div>

  <div class="cur-block money">
    <div class="cur-ic"></div>
    <div>
      <div class="cur-label">MONEY</div>
      <div class="cur-amount">$<span id="money-value">0</span></div>
    </div>
    <div class="cur-rate" id="money-rate" title="What your machines produce, as they produce it">0 $/h</div>
  </div>

  <div class="cur-block gem">
    <div class="cur-ic"></div>
    <div>
      <div class="cur-label">DIAMONDS</div>
      <div class="cur-amount"><span id="gem-value">0</span></div>
    </div>
  </div>

  <div class="cur-block prism">
    <div class="cur-ic"></div>
    <div>
      <div class="cur-label">PRISM</div>
      <div class="cur-amount"><span id="prism-value">0</span></div>
    </div>
  </div>

  <div class="tb-spacer" aria-hidden="true"></div>

  <button id="btn-goals" class="btn goals-btn" title="Objectives">
    <span class="gb-ic"></span><span>Goals</span>
    <span class="tl-badge hidden" id="goal-badge">0</span>
  </button>

  <button id="btn-stuck" class="btn stuck-btn hidden" title="Machines that need you">
    <span id="stuck-label">Attention</span>
    <span class="tl-badge" id="stuck-count">0</span>
  </button>

  <div class="actions">
    <button id="btn-sound" class="btn icon-btn" title="Sound on/off"></button>
    <button id="btn-find" class="btn icon-btn"></button>
    <button id="btn-codex" class="btn icon-btn" title="Codex вЂ” everything in the game"></button>
    <button id="btn-save" class="btn">Save</button>
    <button id="btn-menu" class="btn">Menu</button>
  </div>
</header>

<button id="btn-home" class="hidden"></button>

<div id="devbar"></div>

<main id="stage">
  <canvas id="board"></canvas>
  <div id="sparks"></div>

  <div id="places" class="hidden"></div>

  <div id="gem-layer"></div>

  <div id="left-rail">
    <div id="boost-bar"></div>
  </div>

  <aside id="inspector" class="hidden"></aside>

  <div id="minimap" class="hidden">
    <div class="mm-head"><span class="mm-title">Map</span><button class="mm-toggle" type="button"></button></div>
    <canvas id="mm-canvas"></canvas>
  </div>

  <div id="dock" class="open">
    <div class="dock-tabs">
      <button id="dock-toggle" class="dock-toggle">
        <span class="dt-chev"></span><span class="dt-label">BUILD</span>
      </button>

      <label id="dock-find" class="hidden">
        <input id="dock-find-input" type="text" autocomplete="off" spellcheck="false">
        <button class="df-clear hidden" type="button" tabindex="-1">&times;</button>
      </label>
    </div>
    <div id="dock-body">
      <div id="palette"></div>
    </div>
  </div>

  <div id="tree-launch">
    <button class="tl-btn ci" data-tree="ci" title="Clean Index skills">
      <span class="tl-ic"></span><span class="tl-label">Machine Tree</span>

      <span class="tl-badge hidden" id="ci-badge">0</span>
    </button>
    <button class="tl-btn money" data-tree="money" title="Money skills">
      <span class="tl-ic"></span><span class="tl-label">Money Skills</span>
    </button>
  </div>

  <div id="boost-launch">
    <button class="tl-btn gem" data-panel="boosts" title="Spend diamonds on temporary boosts">
      <span class="tl-ic"></span><span class="tl-label">Boosts</span>
    </button>

    <button id="bp-launch" class="tl-btn bp hidden" data-panel="blueprints"
            title="Saved groups of machines, ready to stamp down">
      <span class="tl-ic"></span><span class="tl-label">Blueprints</span>
      <span class="tl-badge">0</span>
    </button>
  </div>

</main>

<div id="toasts"></div>

<div id="panel" class="hidden">
  <div class="pn-card">
    <div class="pn-head">
      <span class="pn-ic"></span>
      <h2 id="pn-title">BOOSTS</h2>
      <span class="pn-bank" id="pn-bank">0 &#9670;</span>
      <button id="pn-close" class="btn">Close <kbd>Esc</kbd></button>
    </div>
    <div id="pn-body"></div>
    <p id="pn-note" class="pn-note"></p>
  </div>
</div>

<div id="skilltree" class="hidden">
  <div class="tree-head">
    <h2>SKILL TREE</h2>
    <div class="tree-tabs">
      <button class="tree-tab active" data-tree="ci">Clean Index</button>
      <button class="tree-tab" data-tree="money">Money</button>
      <button class="tree-tab" data-tree="summary" id="tree-tab-sum">Your Tree</button>
    </div>
    <div class="tree-bank">
      <span id="tree-ci">0 CI</span>
      <span id="tree-money">$0</span>
    </div>
    <div id="tree-zoom">
      <button class="tz-btn" data-z="0.8" title="Zoom out">&minus;</button>
      <span id="tree-zoom-pct">100%</span>
      <button class="tz-btn" data-z="1.25" title="Zoom in">+</button>
      <button class="tz-btn wide" data-z="reset" title="Back to 100%">Fit</button>
    </div>
    <button id="tree-close" class="btn">Close <kbd>Esc</kbd></button>
  </div>
  <div class="tree-scroll">
    <div id="tree-inner">
      <svg id="tree-links" width="1560" height="1000"></svg>
    </div>
    <p id="tree-note" class="tree-note"></p>
  </div>
</div>

<div id="menu">
  <canvas id="menu-bg"></canvas>
  <div class="mn-vig"></div>
  <div class="mn-body"></div>
</div>

<script src="js/util.js?v=1365"></script>
<script src="js/icons.js?v=1365"></script>
<script src="js/audio.js?v=1365"></script>
<script src="js/config.js?v=1365"></script>

<script src="js/i18n.js?v=1365"></script>
<script src="js/store.js?v=1365"></script>
<script src="js/state.js?v=1365"></script>
<script src="js/sim.js?v=1365"></script>
<script src="js/pace.js?v=1365"></script>
<script src="js/render.js?v=1365"></script>
<script src="js/gas.js?v=1365"></script>
<script src="js/halloween.js?v=1365"></script>
<script src="js/input.js?v=1365"></script>
<script src="js/ui.js?v=1365"></script>
<script src="js/codexgrid.js?v=1365"></script>
<script src="js/overlay.js?v=1365"></script>
<script src="js/lifter.js?v=1365"></script>
<script src="js/practice.js?v=1365"></script>

<script src="js/tutor.js?v=1365"></script>
<script src="js/guide.js?v=1365"></script>

<script src="js/menu.js?v=1365"></script>
<script src="js/planetview.js?v=1365"></script>

<script src="js/main.js?v=1365"></script>
</body>
</html>
